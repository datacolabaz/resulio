<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.add("js");</script>
    <style>html.js [data-prerender]{display:none!important}html{background:#F7F8FB}html.dark{background:#0B1220}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resulio — müəllimlər üçün onlayn imtahan və qiymətləndirmə platforması</title>
    <meta name="description" content="Resulio onlayn imtahan və qiymətləndirmə platformasıdır: imtahan və tapşırıq yaradın, link və QR kodla paylaşın, nəticələri mövzu üzrə analiz edin. AZ / RU / EN." />
    <meta name="application-name" content="Resulio" />
    <meta property="og:site_name" content="Resulio" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("resulio.theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var locale = localStorage.getItem("resulio-locale");
          if (locale === "en" || locale === "ru") document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/brand/resulio-icon.png" />
    <link rel="apple-touch-icon" href="/brand/resulio-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Resulio — müəllimlər, təlimçilər, tədris mərkəzləri və məktəblər üçün onlayn imtahan və qiymətləndirmə platforması. Təsisçi: Telman Abdulla. <a href="/about">Haqqında</a> · <a href="/faq">Suallar</a></noscript>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
