<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381.33 96">
  <!-- Spotva primary horizontal lockup. Wordmark is real Fraunces
       SemiBold (600), embedded as a subsetted woff2 (glyphs S,p,o,t,v,a
       only) so the mark is self-contained with no external font
       dependency. Icon: verified two-arc "S + Spot" mark, scaled to
       match the wordmark's cap-height (guidelines §12). -->
  <defs>
    <style>
      @font-face {
        font-family: 'Fraunces Spotva Subset';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 600;
        font-style: normal;
      }
    </style>
  </defs>
  <g transform="translate(6,0) scale(1.043478)">
  <path d="M 31 16 A 15 15 0 0 0 31 46 A 15 15 0 0 1 31 76" fill="none" stroke="#FBFAF6" stroke-width="20" stroke-linecap="round"/><circle cx="31" cy="16" r="11" fill="#DB8A2E"/>
</g>
  <text x="135.39" y="73.01" font-family="Fraunces Spotva Subset, Fraunces, Georgia, serif" font-size="70" font-weight="600" fill="#FBFAF6">Spotva</text>
</svg>